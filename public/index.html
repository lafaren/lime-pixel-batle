<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Battle HD</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #000; 
        }
        canvas { 
            display: block; 
            /* Это убирает мыло при зуме */
            image-rendering: optimizeSpeed;             
            image-rendering: -moz-crisp-edges;          
            image-rendering: -webkit-optimize-contrast; 
            image-rendering: -o-crisp-edges;            
            image-rendering: pixelated;                 
            -ms-interpolation-mode: nearest-neighbor;   
        }
        .ui { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.9); padding: 10px 20px; border-radius: 40px;
            display: flex; align-items: center; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        input[type="color"] { border: none; width: 40px; height: 40px; cursor: pointer; background: none; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="ui">
        <input type="color" id="colorPicker" value="#ff0000">
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
