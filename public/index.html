<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Battle Live</title>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 20px; }
        canvas { 
            border: 3px solid #444; 
            background: #fff; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            image-rendering: pixelated; /* Чтобы пиксели были четкими */
            max-width: 90vw;
            cursor: crosshair;
        }
        .ui { margin-top: 15px; background: #333; padding: 10px; border-radius: 8px; display: inline-block; }
        input[type="color"] { width: 50px; height: 50px; border: none; cursor: pointer; vertical-align: middle; }
    </style>
</head>
<body>
    <h1>Pixel Battle</h1>
    <canvas id="canvas"></canvas>
    <br>
    <div class="ui">
        <span>Выбери цвет: </span>
        <input type="color" id="colorPicker" value="#000000">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
