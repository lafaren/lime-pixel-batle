<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Battle: Инструменты</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
        canvas { display: block; image-rendering: pixelated; }
        .ui { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 15, 15, 0.95); padding: 12px 25px; border-radius: 50px;
            display: flex; align-items: center; gap: 15px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
        }
        .tool-btn { 
            background: #222; border: 1px solid #444; color: #ccc; padding: 8px 15px; 
            border-radius: 20px; cursor: pointer; transition: 0.2s; font-size: 12px;
        }
        .tool-btn.active { background: #007bff; color: white; border-color: #00c6ff; }
        input[type="color"] { border: none; width: 35px; height: 35px; cursor: pointer; background: none; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="ui">
        <input type="color" id="colorPicker" value="#4400FF">
        <button class="tool-btn active" id="btn-pencil" onclick="setTool('pencil')">Точка</button>
        <button class="tool-btn" id="btn-brush" onclick="setTool('brush')">Кисть 20x20</button>
        <button class="tool-btn" id="btn-rift" onclick="setTool('rift')">⚡ РАЗЛОМ</button>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
