<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Battle 1000x1000</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
        canvas { display: block; image-rendering: pixelated; }
        .ui { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px; border: 1px solid #444;
        }
        input[type="color"] { width: 40px; height: 40px; border: none; cursor: pointer; background: none; }
        .info { position: fixed; top: 10px; left: 10px; color: white; pointer-events: none; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="info">ЛКМ: Рисовать | ПКМ: Двигать | Колесо: Зум</div>
    <canvas id="canvas"></canvas>
    <div class="ui">
        <input type="color" id="colorPicker" value="#ff0000">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
